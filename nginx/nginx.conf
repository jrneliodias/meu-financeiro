events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Upstream Django
    upstream django {
        server web:8000;
    }

    # Redirect HTTP to HTTPS — meu-financeiro
    server {
        listen 80;
        server_name meu-financeiro.tec.br www.meu-financeiro.tec.br;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS — meu-financeiro
    server {
        listen 443 ssl;
        server_name meu-financeiro.tec.br www.meu-financeiro.tec.br;

        ssl_certificate /etc/letsencrypt/live/meu-financeiro.tec.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/meu-financeiro.tec.br/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 10M;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    # ── Scheduler ──────────────────────────────────────────────

    # Redirect HTTP to HTTPS — scheduler (mantém ACME challenge para renovação)
    server {
        listen 80;
        server_name api.codestelar.com.br;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — scheduler
    server {
        listen 443 ssl;
        server_name api.codestelar.com.br;

        ssl_certificate /etc/letsencrypt/live/api.codestelar.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.codestelar.com.br/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 10M;

        location / {
            proxy_pass http://host.docker.internal:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}
