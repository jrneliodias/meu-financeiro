{% load currency_filters i18n %}
<a href="{% url 'dashboard_spending' %}?month={{ selected_month }}&year={{ selected_year }}"
   class="bg-zinc-800/40 p-3 md:p-4 py-2 rounded-lg hover:bg-zinc-700/40 transition-colors duration-150">
  <div class="flex flex-col items-start">
    <p class="text-white text-xs md:text-sm">{% trans "Spent Today:" %}</p>
    <span id="dailyTotalDisplay" class="text-blue-400 text-xl md:text-2xl font-bold">
      {{ today_total|format_brl }}
    </span>
  </div>
</a>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const value = {{ today_total|default:0 }};
    const formatted = new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    }).format(value);
    document.getElementById('dailyTotalDisplay').textContent = formatted;
});
</script>
