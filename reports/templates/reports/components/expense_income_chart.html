<div class="bg-zinc-800/50 rounded-lg p-3 w-full lg:w-1/2">
  <h2 class="text-2xl font-bold">Expense and Income by Month</h2>
  <div class=" min-h-[800px] mt-2 p-3 px-0">
    <canvas id="expenseIncomeTotalChart" class="w-full"></canvas>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script>


  const expenseIncomeColors = [

  {
    backgroundColor: 'rgba(255, 99, 132, 0.2)',   // Red with opacity
borderColor: 'rgba(255, 99, 132, 1)',          // Solid red      // Lighter purple for border
    borderWidth: 1
  },

  {
    backgroundColor: 'rgba(52, 211, 153, 0.2)',    // Darker green with opacity
    borderColor: 'rgba(52, 211, 153, 1)',          // Lighter green for border
    borderWidth: 1
  },
  ]

  const calculatedExpenseIncomeTotal = {{ monthly_expense_income_datasets|safe }};


  const calculatedExpenseIncomeTotalCtx = document.getElementById('expenseIncomeTotalChart').getContext('2d');

  const calculatedExpenseIncomeTotalDatasets = calculatedExpenseIncomeTotal.datasets.map((dataset, index) => ({
    label: dataset.label, // Payment method name
    data: dataset.datasets,   // Monthly expenses for this payment method
    backgroundColor: expenseIncomeColors[index % expenseIncomeColors.length].backgroundColor, // Rotate through colors
    borderColor: expenseIncomeColors[index % expenseIncomeColors.length].borderColor,
    borderWidth: expenseIncomeColors[index % expenseIncomeColors.length].borderWidth,
  }));


  new Chart(calculatedExpenseIncomeTotalCtx, {
    type: 'bar',
    data: {
        labels: calculatedExpenseIncomeTotal.labels, // Months
        datasets: calculatedExpenseIncomeTotalDatasets, // Payment method datasets
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: {
          padding: {
            top: 20,
            right: 100,  // Increased right padding for labels
            bottom: 10,
            left: 10
          }
        },
        indexAxis: 'y', // This makes the bars horizontal with y-axis categories
        plugins: {
            legend: {
                display: false,
                position: 'right', // Legend on the right
                align: 'start',
                labels: {
                    color: 'white',
                    font: {
                        size: 8
                    }
                }
            },
            tooltip: {
                enabled: true,
            },
            datalabels: {
                anchor: 'end',
                align: 'right', // Position labels at the end of bars
                formatter: function(value, context) {
                    return value > 0
                        ? new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value)
                        : ''; // Hide labels for values <= 0
                },
                color: 'white',
                font: {
                    weight: 'bold',
                    size: 12
                }
            }
        },
        scales: {
            y: {
                title: {
                    display: false, // No need for title on y-axis as it's obvious these are months
                },
              
            
            },
            x: {
                beginAtZero: false,
                title: {
                    display: false,
                    text: 'Amount (R$)',
                    color: 'white'
                },
                ticks: {
                    display: false,
                },
            
            }
        }
    },
    plugins: [ChartDataLabels]
  });
</script>
