{% load currency_filters i18n %}
<header class="flex flex-col gap-2 justify-between">
  <section class="flex flex-col lg:flex-row lg:items-center justify-between gap-2">
    <h1 class="text-2xl md:text-3xl font-bold my-2 md:my-3">{% trans "Dashboard" %}</h1>
<div class="flex flex-col sm:flex-row sm:items-center gap-2 md:gap-4">
    {% include "reports/components/payment_notifications_toggle.html" %}
<form method="get"
        class="flex bg-zinc-800/40 p-3 md:p-4 rounded-lg space-x-2 md:space-x-4 w-full sm:w-fit">
    <select name="month"
            id="month"
            class="flex-1 sm:flex-none min-w-[100px] md:min-w-[150px] px-2 md:px-3 bg-transparent py-2 text-sm md:text-base border border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 *:bg-zinc-900"
            onchange="this.form.submit()">
      {% for month_num, month_name in distinct_months %}
        <option value="{{ month_num }}"
                {% if selected_month == month_num %}selected{% endif %}>{{ month_name|translate_month }}</option>
      {% endfor %}
    </select>
    <select name="year"
            id="year"
            class="flex-1 sm:flex-none px-2 md:px-3 bg-transparent py-2 text-sm md:text-base border border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 *:bg-zinc-900"
            onchange="this.form.submit()">
      {% for year_value, year_label in distinct_years %}
        <option value="{{ year_value }}"
                {% if selected_year == year_value %}selected{% endif %}>{{ year_label }}</option>
      {% endfor %}
    </select>
  </form>
  </div>
  </section>
</header>
