{% load currency_filters %}
<header class="flex flex-col gap-2 lg:flex-row justify-between">
  <h1 class="text-3xl font-bold my-3">Dashboard</h1>
  <div class="flex flex-col sm:flex-row gap-2">
    <div class="flex flex-col items-start bg-zinc-800/40 p-4 py-2 rounded-lg">
      <p class="text-white text-sm">Saldo:</p>
      <span id="balanceDisplay" class="text-white text-2xl font-bold">{{ global_balance|format_brl }}</span>
    </div>
    {% include "reports/components/fixed_expenses_card.html" %}
  </div>
  <form method="get"
        class="flex bg-zinc-800/40 p-4 rounded-lg space-x-4 w-fit">
    <select name="month"
            id="month"
            class="w-full min-w-[150px] px-3 bg-transparent py-2 border border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-fit *:bg-zinc-900"
            onchange="this.form.submit()">
      {% for month_num, month_name in distinct_months %}
        <option value="{{ month_num }}"
                {% if selected_month == month_num %}selected{% endif %}>{{ month_name }}</option>
      {% endfor %}
    </select>
    <select name="year"
            id="year"
            class="w-full px-3 bg-transparent py-2 border border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-fit *:bg-zinc-900"
            onchange="this.form.submit()">
      {% for year_value, year_label in distinct_years %}
        <option value="{{ year_value }}"
                {% if selected_year == year_value %}selected{% endif %}>{{ year_label }}</option>
      {% endfor %}
    </select>
  </form>
</header>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Get the balance value
    const balanceValue = {{ global_balance|default:0 }};

    // Format as BRL currency
    const formattedBalance = new Intl.NumberFormat('pt-BR', {
      style: 'currency',
      currency: 'BRL'
    }).format(balanceValue);

    // Display the formatted value
    document.getElementById('balanceDisplay').textContent = formattedBalance;
  });
</script>
