{% load i18n %}
{# Clique abre a lista das parcelas do mês (página própria, sem modal) #}
<a href="{% url 'expense_list_page' %}?installments=1&month={{ selected_month }}&year={{ selected_year }}&back={{ request.get_full_path|urlencode }}"
   id="installmentMonthlyCardRoot" title="{% trans 'See installment expenses' %}"
   class="group relative bg-zinc-800/40 p-3 md:p-4 py-2 pr-6 rounded-lg hover:bg-zinc-700/40 transition-colors duration-150">
  <i class="fa-solid fa-chevron-right absolute top-2 right-2 text-[10px] text-zinc-500 group-hover:text-zinc-200 transition-colors" aria-hidden="true"></i>
  <div class="flex flex-col items-start">
    <p class="text-white text-xs md:text-sm">{% trans "Monthly Installments:" %}</p>
    <span id="installmentMonthlyDisplay" class="text-purple-400 text-xl md:text-2xl font-bold">
      {{ installment_monthly_summary.formatted_total }}
    </span>
  </div>
</a>
