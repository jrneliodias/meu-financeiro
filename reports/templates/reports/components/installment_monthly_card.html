{% load currency_filters i18n %}
<div class="bg-zinc-800/40 p-3 md:p-4 py-2 rounded-lg">
  <div class="flex flex-col items-start">
    <p class="text-white text-xs md:text-sm">{% trans "Monthly Installments:" %}</p>
    <span id="installmentMonthlyDisplay" class="text-purple-400 text-xl md:text-2xl font-bold">
      {{ installment_monthly_summary.formatted_total }}
    </span>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const value = {{ installment_monthly_summary.total_amount|default:0 }};
    const formatted = new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    }).format(value);
    document.getElementById('installmentMonthlyDisplay').textContent = formatted;
});
</script>
