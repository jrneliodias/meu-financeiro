{% load i18n %}
<div class="bg-zinc-800/50 rounded-lg p-3 w-full lg:w-1/2">
  <h2 class="text-xl md:text-2xl font-bold">{% trans "Monthly Expenses by Payment Method" %}</h2>
  <div class="h-[70vh] min-h-[500px] lg:h-auto lg:min-h-[800px] mt-2 p-3 px-0 w-full">
    <canvas id="calculatedPaymentMethodExpenseChart" class="w-full"></canvas>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script>
  const isMobilePaymentMethod = window.innerWidth < 768;

  const PaymentMethodcolors = [
    {
      backgroundColor: 'rgba(253, 186, 116, 0.2)',
      borderColor: 'rgba(253, 186, 116, 1)',
      borderWidth: 1
    },
    {
      backgroundColor: 'rgba(167, 139, 250, 0.2)',
      borderColor: 'rgba(167, 139, 250, 1)',
      borderWidth: 1
    },
    {
      backgroundColor: 'rgba(255, 99, 132, 0.2)',
      borderColor: 'rgba(255, 99, 132, 1)',
      borderWidth: 1
    },
  ]

  const calculatedPaymentMethodRawData = {{ calculated_monthy_payment_method_expense_totals| safe }};
  const calculatedPaymentMethodLabels = calculatedPaymentMethodRawData.labels;
  const calculatedPaymentMethodLabelsDatasets = calculatedPaymentMethodRawData.datasets.map((dataset, index) => ({
    label: dataset.label,
    data: dataset.data,
    backgroundColor: PaymentMethodcolors[index % PaymentMethodcolors.length].backgroundColor,
    borderColor: PaymentMethodcolors[index % PaymentMethodcolors.length].borderColor,
    borderWidth: PaymentMethodcolors[index % PaymentMethodcolors.length].borderWidth,
  }));

  const calculatedPaymentMethodExpenseChartCtx = document.getElementById('calculatedPaymentMethodExpenseChart').getContext('2d');
  new Chart(calculatedPaymentMethodExpenseChartCtx, {
    type: 'bar',
    data: {
      labels: calculatedPaymentMethodLabels,
      datasets: calculatedPaymentMethodLabelsDatasets,
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: {
        padding: {
          top: 10,
          right: isMobilePaymentMethod ? 70 : 100,
          bottom: 2,
          left: 0
        }
      },
      indexAxis: 'y',
      barThickness: isMobilePaymentMethod ? 10 : 14,
      categoryPercentage: isMobilePaymentMethod ? 0.5 : 0.8,
      barPercentage: isMobilePaymentMethod ? 0.9 : 0.85,
      plugins: {
        legend: {
          display: isMobilePaymentMethod ? false : true,
          position: 'top',
          labels: {
            color: 'white',
            font: { size: 12 },
            boxWidth: 14
          }
        },
        tooltip: {
          enabled: true,
        },
        datalabels: {
          anchor: 'end',
          align: 'right',
          formatter: function (value, context) {
            if (value <= 0) return '';
            if (isMobilePaymentMethod) {
              return 'R$ ' + (value/1000).toFixed(1) + 'k';
            }
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
          },
          color: 'white',
          font: {
            weight: 'bold',
            size: isMobilePaymentMethod ? 10 : 12
          }
        }
      },
      scales: {
        y: {
          stacked: false,
          title: { display: false },
          ticks: {
            font: { size: isMobilePaymentMethod ? 11 : 13 },
            color: 'white'
          }
        },
        x: {
          stacked: false,
          display: false,
          beginAtZero: true,
        },
      },
    },
    plugins: [ChartDataLabels]
  });
</script>
