<!-- Recurring Expense Details Modal -->
<div id="recurringExpenseModal"
     class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-zinc-800 rounded-lg shadow-xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-hidden">
        <!-- Modal Header -->
        <div class="flex items-center justify-between p-6 border-b border-zinc-700">
            <h2 class="text-xl font-semibold text-white flex items-center">
                <i class="fas fa-repeat mr-3 text-blue-400"></i>
                <span id="recurringModalTitle">Recurring Expense Details</span>
            </h2>
            <button id="recurringModalCloseBtn"
                    class="text-gray-400 hover:text-white transition-colors duration-200">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <!-- Modal Body -->
        <div class="p-6 overflow-y-auto max-h-[calc(90vh-140px)]" id="recurringExpenseContent">
            <!-- Loading State -->
            <div id="recurringModalLoading" class="text-center py-8">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-400 mb-4"></div>
                <p class="text-gray-300">Loading details...</p>
            </div>

            <!-- Error State -->
            <div id="recurringModalError"
                 class="hidden bg-red-900 border border-red-700 text-red-300 px-4 py-3 rounded">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    <span id="recurringModalErrorMessage">Failed to load details.</span>
                </div>
            </div>

            <!-- Success State -->
            <div id="recurringModalContent" class="hidden">
                <!-- Summary Section -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-zinc-700 rounded-lg p-4 text-center">
                        <h3 class="text-sm font-medium text-gray-400 mb-2">Monthly Amount</h3>
                        <p class="text-2xl font-bold text-blue-400" id="recurringModalAmount">R$ 0,00</p>
                    </div>
                    <div class="bg-zinc-700 rounded-lg p-4 text-center">
                        <h3 class="text-sm font-medium text-gray-400 mb-2">Generated Expenses</h3>
                        <p class="text-2xl font-bold text-green-400" id="recurringModalCount">0</p>
                    </div>
                    <div class="bg-zinc-700 rounded-lg p-4 text-center">
                        <h3 class="text-sm font-medium text-gray-400 mb-2">Total Generated</h3>
                        <p class="text-2xl font-bold text-yellow-400" id="recurringModalTotal">R$ 0,00</p>
                    </div>
                </div>

                <!-- Expenses List -->
                <div class="bg-zinc-700 rounded-lg overflow-hidden">
                    <h3 class="text-lg font-medium p-4 bg-zinc-600">Generated Expenses</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-zinc-600">
                                <tr class="text-left">
                                    <th class="px-4 py-3 text-sm font-medium text-gray-300">Date</th>
                                    <th class="px-4 py-3 text-sm font-medium text-gray-300">Description</th>
                                    <th class="px-4 py-3 text-sm font-medium text-gray-300">Category</th>
                                    <th class="px-4 py-3 text-sm font-medium text-gray-300">Payment Method</th>
                                    <th class="px-4 py-3 text-sm font-medium text-gray-300 text-right">Amount</th>
                                </tr>
                            </thead>
                            <tbody id="recurringExpensesList" class="divide-y divide-zinc-600">
                                <!-- Expenses will be inserted here via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Footer -->
        <div class="flex justify-end p-6 border-t border-zinc-700">
            <button id="recurringModalCloseFooterBtn"
                    class="bg-gray-600 hover:bg-gray-700 text-white font-medium py-2 px-6 rounded-lg transition-colors duration-200">
                <i class="fas fa-times mr-2"></i>
                Close
            </button>
        </div>
    </div>
</div>
