{% load currency_filters i18n %}
{# Clique abre o detalhamento do total esperado (página própria, sem modal) #}
<a href="{% url 'budget_breakdown' %}?month={{ selected_month }}&year={{ selected_year }}&back={{ request.get_full_path|urlencode }}"
   title="{% trans 'See breakdown' %}"
   class="bg-zinc-800/40 p-3 md:p-4 py-2 rounded-lg hover:bg-zinc-700/40 transition-colors duration-150">
  <div class="flex flex-col items-start">
    <p class="text-white text-xs md:text-sm">{% trans 'Expected Total:' %}</p>
    <span class="text-blue-400 text-xl md:text-2xl font-bold">{{ budget_summary.adjusted_expected|format_brl }}</span>
  </div>
</a>
