{% load i18n %}
<!-- Process Recurring Expenses Modal -->
<div id="processRecurringModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-zinc-800 rounded-lg shadow-xl max-w-md w-full mx-4">
        <!-- Header -->
        <div class="flex justify-between items-center p-6 border-b border-zinc-700">
            <h2 class="text-xl font-bold text-white">
                <i class="fas fa-calendar-check mr-2"></i>{% trans "Process Recurring Expenses" %}
            </h2>
            <button onclick="closeProcessRecurringModal()" class="text-gray-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="p-6">
            <p class="text-gray-300 mb-4">
                {% trans "Select the month and year to generate active recurring expenses." %}
            </p>

            <form id="processRecurringForm">
                {% csrf_token %}

                <!-- Month Selector -->
                <div class="mb-4">
                    <label class="block text-gray-300 mb-2">{% trans "Month" %}</label>
                    <select id="processMonth" name="month" class="w-full bg-zinc-700 text-white border border-zinc-600 rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                        {% for month_num, month_name in all_months %}
                            <option value="{{ month_num }}">{{ month_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Year Input -->
                <div class="mb-4">
                    <label class="block text-gray-300 mb-2">{% trans "Year" %}</label>
                    <input type="number" id="processYear" name="year" min="2020" max="2100"
                           class="w-full bg-zinc-700 text-white border border-zinc-600 rounded-lg p-2 focus:ring-2 focus:ring-blue-500"
                           required>
                </div>
            </form>

            <!-- Result Message -->
            <div id="processResult" class="hidden mt-4 p-4 rounded-lg"></div>
        </div>

        <!-- Footer -->
        <div class="flex justify-end gap-3 p-6 border-t border-zinc-700">
            <button onclick="closeProcessRecurringModal()"
                    class="px-4 py-2 bg-zinc-700 text-white rounded-lg hover:bg-zinc-600">
                {% trans "Cancel" %}
            </button>
            <button onclick="submitProcessRecurring()"
                    id="processBtn"
                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                <i class="fas fa-check mr-2"></i>{% trans "Process" %}
            </button>
        </div>
    </div>
</div>
