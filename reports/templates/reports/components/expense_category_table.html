<div class="my-3 space-y-4 bg-slate-800/50 rounded-lg p-3">
    <h2 class="text-2xl font-bold">Expenses by Category</h2>
    <table class="p-2 w-full" border="1">
        <thead>
            <tr class="*:p-2 border-b border-slate-700">
                <th class="text-left">Category</th>
                {% for month in all_months %}
                    <th class="text-left">{{ month }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
          <tr class="*:p-2 border-b border-slate-700 bg-slate-800/50">
            <td class="font-bold">Total</td>
            {% for value in formatted_totals %}
                <td class="text-left font-bold">{{ value }}</td>
            {% endfor %}
          </tr>
            {% for category, values in formatted_expenses_by_category.items %}
                <tr class="*:p-2 border-b border-slate-700 hover:bg-slate-800/30">
                    <td class="font-medium">{{ category }}</td>
                    {% for value in values %}
                        <td class="text-left {% if value == 'R$ 0,00' %}text-slate-600{% endif %}">
                            {{ value }}
                        </td>
                    {% endfor %}
                </tr>
            {% endfor %}
            
        </tbody>
    </table>
</div>
