{% load i18n static %}
<div class="bg-zinc-800/50 rounded-lg p-3 w-full min-w-0 flex flex-col lg:flex-1 lg:min-h-0">
  <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-3 mb-4 lg:mb-1">
    <h2 class="text-xl md:text-2xl lg:text-lg font-bold">{% trans "Daily Spending Chart" %}</h2>
    <div class="grid grid-cols-2 md:flex gap-2">
      <select id="dailyChartPeriod"
              class="bg-zinc-700 text-white text-sm rounded px-2 py-1">
        <option value="7">{% trans "7 Days" %}</option>
        <option value="30" selected>{% trans "30 Days" %}</option>
        <option value="60">{% trans "60 Days" %}</option>
        <option value="90">{% trans "90 Days" %}</option>
      </select>
      <select id="dailyCategoryFilter"
              class="bg-zinc-700 text-white text-sm rounded px-2 py-1 col-span-2 md:col-span-1">
        <option value="">{% trans "All Categories" %}</option>
        {% for cat in expense_categories %}
          <option value="{{ cat.id }}">{{ cat.name }}</option>
        {% endfor %}
      </select>
      <select id="dailyChartType" class="bg-zinc-700 text-white text-sm rounded px-2 py-1">
        <option value="bar">{% trans "Bar" %}</option>
        <option value="line" selected>{% trans "Line" %}</option>
      </select>
      <select id="dailyChartScale"
              class="bg-zinc-700 text-white text-sm rounded px-2 py-1">
        <option value="linear" selected>{% trans "Linear" %}</option>
        <option value="logarithmic">{% trans "Log" %}</option>
      </select>
      <select id="outlierHandling"
              class="bg-zinc-700 text-white text-sm rounded px-2 py-1">
        <option value="show" selected>{% trans "All Data" %}</option>
        <option value="highlight">{% trans "Highlight" %}</option>
        <option value="separate">{% trans "Hide Outliers" %}</option>
      </select>
    </div>
  </div>
  <!-- Debug Information Display -->
  <div id="debugInfo"
       class="mb-4 p-2 bg-zinc-700 rounded text-sm text-white"
       style="display: none">
    <strong>Debug Information:</strong>
    <div id="debugContent"></div>
  </div>
  <div class="relative h-[50vh] min-h-[300px] md:h-[60vh] lg:h-auto lg:min-h-0 lg:flex-1 mt-2 p-3 px-0 w-full">
    <canvas id="dailySpendingChart" class="w-full"></canvas>
  </div>
</div>
<!-- Django's json_script for safe data passing -->
{{ daily_spending_data|json_script:"daily-spending-data" }}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script>
  window.DailyChartI18n = {
    dailySpending: "{% trans 'Daily Spending' %}",
    sevenDayAverage: "{% trans '7-Day Average' %}",
    dateLabel: "{% trans 'Date' %}",
    loadingData: "{% trans 'Loading new data...' %}",
    errorLoadingData: "{% trans 'Error loading new data. Please try again.' %}",
    outliersLabel: "{% trans 'Outliers (>R$ 1,000)' %}",
    errorLoadingChart: "{% trans 'Error loading daily spending chart' %}",
    checkConsole: "{% trans 'Check browser console for more details' %}",
    showDebugInfo: "{% trans 'Show Debug Info' %}",
  };
</script>
<script src="{% static 'js/daily_spending_chart.js' %}"></script>
