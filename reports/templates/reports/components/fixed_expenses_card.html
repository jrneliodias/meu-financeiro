{% load currency_filters %}
<div class="bg-zinc-800/40 p-4 py-2 rounded-lg">
  <div class="flex flex-col items-start">
    <p class="text-white text-sm">Despesas Fixas:</p>
    <span id="fixedExpensesDisplay" class="text-orange-400 text-2xl font-bold">
      {{ fixed_expenses_summary.formatted_total }}
    </span>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Get the fixed expenses value
    const fixedExpensesValue = {{ fixed_expenses_summary.total_amount|default:0 }};

    // Format as BRL currency
    const formattedFixedExpenses = new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    }).format(fixedExpensesValue);

    // Display the formatted value
    document.getElementById('fixedExpensesDisplay').textContent = formattedFixedExpenses;
});
</script>
