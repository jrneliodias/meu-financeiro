{% load currency_filters i18n %}
<div class="bg-zinc-800/40 p-3 md:p-4 py-2 rounded-lg">
  <div class="flex flex-col items-start">
    <p class="text-white text-xs md:text-sm">{% trans "Estimated:" %}</p>
    <span id="estimatedExpensesDisplay" class="text-yellow-400 text-xl md:text-2xl font-bold">
      {{ budget_summary.total_estimated|format_brl }}
    </span>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const value = {{ budget_summary.total_estimated|default:0 }};
    const formatted = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    document.getElementById('estimatedExpensesDisplay').textContent = formatted;
});
</script>
