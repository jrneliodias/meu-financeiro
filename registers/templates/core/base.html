{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="keywords" content="My Dashboard" />
  <meta name="description" content="My Dashboard" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <link href="{% static 'css/custom.css' %}" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <title>Dashboard</title>
</head>

<body class="bg-zinc-900 w-full min-h-screen grid lg:grid-cols-[auto_1fr]" style="font-family: 'JetBrains Mono', monospace;">
  <aside class="sticky top-0 z-50 h-fit lg:h-screen lg:overflow-y-auto w-full lg:pt-10 p-2 lg:p-3 text-white grid grid-cols-5 lg:flex lg:flex-col gap-2 border-r border-zinc-700 min-w-[190px] bg-zinc-900 lg:gap-4">
    <a href="{% url 'expense_report' %}"
      class="font-semibold flex items-center justify-center lg:justify-start gap-2 hover:bg-zinc-700 p-4 lg:px-4 lg:py-2 rounded-lg {% if request.path == '/' %}bg-blue-800 font-semibold hover:bg-blue-800{% endif %}">
      <i class="fa-solid fa-house text-sm lg:text-xs"></i>
      <span class="text-sm hidden lg:block">Dashboard</span>
    </a>
    <a href="{% url 'register_expense' %}"
      class="font-semibold flex items-center justify-center lg:justify-start gap-2 hover:bg-zinc-700 p-4 lg:px-4 lg:py-2 rounded-lg {% if request.path == '/register/expense' %}bg-blue-800 font-semibold hover:bg-blue-800{% endif %}">
      <i class="fa-solid fa-coins text-sm lg:text-xs"></i>
      <span class="text-sm hidden lg:block">Register Expense</span>
    </a>
    <a href="{% url 'register_income' %}"
      class="font-semibold flex items-center justify-center lg:justify-start gap-2 hover:bg-zinc-700 p-4 lg:px-4 lg:py-2 rounded-lg {% if request.path == '/register/income' %}bg-blue-800 font-semibold hover:bg-blue-800{% endif %}">
      <i class="fa-solid fa-coins text-sm lg:text-xs"></i>
      <span class="text-sm hidden lg:block">Register Income</span>
    </a>
    <a href="{% url 'quick_fill_preset_list' %}"
      class="font-semibold flex items-center justify-center lg:justify-start gap-2 hover:bg-zinc-700 p-4 lg:px-4 lg:py-2 rounded-lg {% if 'quick-fill-presets' in request.path %}bg-blue-800 font-semibold hover:bg-blue-800{% endif %}">
      <i class="fa-solid fa-bolt text-sm lg:text-xs"></i>
      <span class="text-sm hidden lg:block">Quick Fill Presets</span>
    </a>
    <a href="{% url 'recurring_expense_list' %}"
      class="font-semibold flex items-center justify-center lg:justify-start gap-2 hover:bg-zinc-700 p-4 lg:px-4 lg:py-2 rounded-lg {% if 'recurring-expense' in request.path %}bg-blue-800 font-semibold hover:bg-blue-800{% endif %}">
      <i class="fa-solid fa-repeat text-sm lg:text-xs"></i>
      <span class="text-sm hidden lg:block">Recurring Expenses</span>
    </a>
    <a href="{% url 'budget_estimate_list' %}"
      class="font-semibold flex items-center justify-center lg:justify-start gap-2 hover:bg-zinc-700 p-4 lg:px-4 lg:py-2 rounded-lg {% if 'estimativas' in request.path %}bg-blue-800 font-semibold hover:bg-blue-800{% endif %}">
      <i class="fa-solid fa-chart-pie text-sm lg:text-xs"></i>
      <span class="text-sm hidden lg:block">Estimativas</span>
    </a>
    <a href="{% url 'csv_import' %}"
      class="font-semibold flex items-center justify-center lg:justify-start gap-2 hover:bg-zinc-700 p-4 lg:px-4 lg:py-2 rounded-lg {% if 'csv-import' in request.path %}bg-blue-800 font-semibold hover:bg-blue-800{% endif %}">
      <i class="fa-solid fa-file-csv text-sm lg:text-xs"></i>
      <span class="text-sm hidden lg:block">CSV Import</span>
    </a>
    <a href="/admin" class="font-semibold flex items-center justify-center lg:justify-start gap-2 hover:bg-zinc-700 p-4 lg:px-4 lg:py-2 rounded-lg">
      <i class="fa-solid fa-user-shield text-sm lg:text-xs"></i>
      <span class="text-sm hidden lg:block">Admin</span>
    </a>
    <div class="flex items-center justify-center lg:justify-start gap-2 p-4 lg:px-4 lg:py-2 text-zinc-400">
      <i class="fa-solid fa-user text-sm lg:text-xs"></i>
      <span class="text-sm hidden lg:block">{{ user.username }}</span>
    </div>
    <a href="{% url 'logout' %}" class="font-semibold flex items-center justify-center lg:justify-start gap-2 hover:bg-red-900/50 p-4 lg:px-4 lg:py-2 rounded-lg text-red-400">
      <i class="fa-solid fa-right-from-bracket text-sm lg:text-xs"></i>
      <span class="text-sm hidden lg:block">Logout</span>
    </a>

  </aside>
  <main class="p-2 lg:p-6 text-white">
    {% block content %} {% endblock content %}
  </main>
</body>

</html>
