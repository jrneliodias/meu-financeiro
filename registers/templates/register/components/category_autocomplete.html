{% load i18n %}
<div class="relative" id="category-autocomplete-wrapper" data-category-type="{{ category_type|default:'expense' }}"
     data-search-url="{% url 'category_search_ajax' %}" data-create-url="{% url 'category_create_ajax' %}">
    <input type="text"
           id="category-search-input"
           placeholder="{% trans 'Search or create category...' %}"
           autocomplete="off"
           role="combobox" aria-expanded="false" aria-controls="category-dropdown"
           class="w-full px-3 bg-transparent py-2 border border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

    <ul id="category-dropdown" role="listbox"
        class="hidden absolute z-50 w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-lg max-h-48 overflow-y-auto shadow-lg">
    </ul>

    <div class="hidden">
        {{ form.category }}
    </div>
    {% for error in form.category.errors %}<p class="mt-1 text-sm text-red-400">{{ error }}</p>{% endfor %}
</div>
